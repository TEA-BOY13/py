<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
background: linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card-box{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:40px;
color:white;
width:100%;
max-width:450px;
animation:fadeUp 1s ease;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.form-control{
border-radius:15px;
padding:12px;
}

.btn-custom{
border-radius:30px;
font-weight:bold;
padding:12px;
}

.logo{
font-size:1.5rem;
font-weight:bold;
color:#0dcaf0;
}

.toggle{
cursor:pointer;
}

.spinner-border{
display:none;
}
</style>
</head>
<body>

<div class="card-box">

<div class="text-center mb-4">
<div class="logo">
<i class="bi bi-code-slash"></i>
VISIONARYTECH TITAN
</div>

<h3 class="mt-3">Create Account</h3>
<p class="text-secondary">Python Learning Hub</p>
</div>

<form id="signupForm">

<div class="mb-3">
<input type="text"
class="form-control"
id="fullname"
placeholder="Full Name"
required>
</div>

<div class="mb-3">
<input type="email"
class="form-control"
id="email"
placeholder="Email Address"
required>
</div>

<div class="mb-3 position-relative">

<input type="password"
class="form-control"
id="password"
placeholder="Password"
required>

<span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle"
onclick="togglePassword()">
<i class="bi bi-eye" id="eyeIcon"></i>
</span>

</div>

<button class="btn btn-info w-100 btn-custom">
<span class="spinner-border spinner-border-sm" id="loader"></span>
Create Account
</button>

</form>

<div class="text-center mt-4">
Already have an account?
<a href="login.html" class="text-info">
Login
</a>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain: "vttonlinelesson.firebaseapp.com",
databaseURL: "https://vttonlinelesson-default-rtdb.firebaseio.com",
projectId: "vttonlinelesson",
storageBucket: "vttonlinelesson.firebasestorage.app",
messagingSenderId: "152996856308",
appId: "1:152996856308:web:f0988069482ce7e893f9a1",
measurementId: "G-CC59VEFF32"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("signupForm");

form.addEventListener("submit", async(e)=>{

e.preventDefault();

loader.style.display="inline-block";

const fullname=document.getElementById("fullname").value;
const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

try{

const userCredential=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(doc(db,"users",userCredential.user.uid),{

fullname:fullname,
email:email,
role:"learner",
createdAt:new Date()

});

loader.style.display="none";

Swal.fire({
icon:"success",
title:"Success",
text:"Account created successfully"
}).then(()=>{
window.location="login.html";
});

}catch(error){

loader.style.display="none";

Swal.fire({
icon:"error",
title:"Error",
text:error.message
});

}

});

window.togglePassword=function(){

const password=document.getElementById("password");
const eye=document.getElementById("eyeIcon");

if(password.type==="password"){
password.type="text";
eye.className="bi bi-eye-slash";
}else{
password.type="password";
eye.className="bi bi-eye";
}

}

</script>

</body>
</html>
