<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise Management | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* Sidebar */
.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#1e293b;
padding:20px;
overflow-y:auto;
}

.logo{
font-size:1.3rem;
font-weight:bold;
color:#0dcaf0;
margin-bottom:30px;
}

.sidebar a{
display:block;
text-decoration:none;
color:#cbd5e1;
padding:15px;
border-radius:15px;
margin-bottom:10px;
transition:.3s;
}

.sidebar a:hover{
background:#0dcaf0;
color:black;
}

/* Main */
.main{
margin-left:270px;
padding:30px;
}

/* Search Box */
.search-box{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
margin-bottom:25px;
}

/* Exercise Cards */
.exercise-card{
background:rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
margin-bottom:25px;
box-shadow:0 0 20px rgba(0,0,0,.3);
animation:fadeUp .5s ease;
transition:.3s;
}

.exercise-card:hover{
transform:translateY(-5px);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.student-name{
font-size:1.2rem;
font-weight:bold;
color:#0dcaf0;
}

.answer-box{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.star-btn{
border:none;
background:none;
font-size:22px;
color:gold;
cursor:pointer;
}

.comment-box{
border-radius:15px;
resize:none;
}

.action-btn{
border-radius:30px;
}

/* Mobile */
@media(max-width:768px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
padding:20px;
}

}

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

<div class="logo">
<i class="bi bi-shield-lock"></i>
VTT ADMIN
</div>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
 Dashboard
</a>

<a href="exercises.html">
<i class="bi bi-journal-text"></i>
 Exercises
</a>

<a href="#">
<i class="bi bi-people"></i>
 Students
</a>

<a href="#" id="logoutBtn">
<i class="bi bi-box-arrow-right"></i>
 Logout
</a>

</div>

<!-- Main -->
<div class="main">

<h2 class="mb-4">
📚 Student Exercises
</h2>

<!-- Search & Filter -->
<div class="search-box">

<div class="row">

<div class="col-md-6 mb-3">
<input
type="text"
id="searchInput"
class="form-control"
placeholder="Search student name...">
</div>

<div class="col-md-6">

<select id="filterLesson" class="form-select">

<option value="all">All Lessons</option>

<option value="1">Lesson 1</option>
<option value="2">Lesson 2</option>
<option value="3">Lesson 3</option>
<option value="4">Lesson 4</option>
<option value="5">Lesson 5</option>
<option value="6">Lesson 6</option>
<option value="7">Lesson 7</option>
<option value="8">Lesson 8</option>
<option value="9">Lesson 9</option>
<option value="10">Lesson 10</option>

</select>

</div>

</div>

</div>

<!-- Exercise Cards Container -->
<div id="exerciseList">

<div class="text-center">

<div class="spinner-border text-info"></div>

<p class="mt-3">
Loading exercises...
</p>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import Swal from "https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm";

const firebaseConfig = {
apiKey: "AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain: "vttonlinelesson.firebaseapp.com",
projectId: "vttonlinelesson",
storageBucket: "vttonlinelesson.firebasestorage.app",
messagingSenderId: "152996856308",
appId: "1:152996856308:web:f0988069482ce7e893f9a1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allExercises = [];


/* ADMIN PROTECTION */
onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location="login.html";
return;

}

/* Verify role */
const userSnap = await getDoc(
doc(db,"users",user.uid)
);

if(!userSnap.exists()){

window.location="../login.html";
return;

}

const userData = userSnap.data();

if(userData.role !== "admin"){

Swal.fire({
icon:"error",
title:"Access Denied",
text:"Admins only!"
});

setTimeout(()=>{
window.location="../dashboard.html";
},1500);

return;

}

loadExercises();

});


/* LOAD EXERCISES */
async function loadExercises(){

document.getElementById("exerciseList").innerHTML=`
<div class="text-center">
<div class="spinner-border text-info"></div>
<p class="mt-3">Loading exercises...</p>
</div>
`;

allExercises=[];

const exerciseSnap =
await getDocs(collection(db,"exercises"));

for(const exerciseDoc of exerciseSnap.docs){

let exerciseData = exerciseDoc.data();

let studentName = "Unknown Student";
let studentEmail = "";

try{

const userSnap = await getDoc(
doc(db,"users",exerciseData.userId)
);

if(userSnap.exists()){

studentName = userSnap.data().fullname;
studentEmail = userSnap.data().email;

}

}catch(err){

console.log(err);

}

allExercises.push({

id:exerciseDoc.id,

studentName,
studentEmail,

...exerciseData

});

}

renderExercises(allExercises);

}

function renderExercises(list){

let html = "";

list.forEach(ex=>{

const initials =
ex.studentName
? ex.studentName.charAt(0).toUpperCase()
: "?";

html += `

<div class="exercise-card">

<div class="row">

<div class="col-md-8">

<div class="d-flex align-items-center mb-3">

<div class="rounded-circle bg-info text-dark fw-bold d-flex justify-content-center align-items-center"
style="width:60px;height:60px;font-size:22px;">

${initials}

</div>

<div class="ms-3">

<h5 class="student-name mb-1">

${ex.studentName || "Unknown Student"}

</h5>

<small class="text-secondary">

${ex.studentEmail || ""}

</small>

</div>

</div>

</div>

<div class="col-md-4 text-md-end">

<span class="badge bg-info fs-6">

Lesson ${ex.lesson}

</span>

</div>

</div>


<!-- Exercise Answer -->

<div class="answer-box">

<h6 class="text-success">

<i class="bi bi-code-slash"></i>

Student Answer

</h6>

<p class="mb-0">

${ex.answer}

</p>

</div>


<!-- Status -->

<div class="mt-3">

<p>

❤️ Status :

<span class="${
ex.liked
? 'text-success'
: 'text-danger'
}">

${ex.liked ? "Liked" : "Not Liked"}

</span>

</p>


<p>

⭐ Rating :

<span class="text-warning">

${ex.rating || 0}/5

</span>

</p>


<p>

💬 Comment :

<span class="text-info">

${ex.comment || "No comment yet"}

</span>

</p>

</div>


<hr>


<!-- Action Buttons -->

<div class="d-flex flex-wrap gap-2">

<button
class="btn btn-success action-btn"
onclick="likeExercise('${ex.id}',true)">

❤️ Like

</button>


<button
class="btn btn-secondary action-btn"
onclick="likeExercise('${ex.id}',false)">

🤍 Unlike

</button>


<button
class="btn btn-warning action-btn"
onclick="rateExercise('${ex.id}',1)">

⭐1

</button>

<button
class="btn btn-warning action-btn"
onclick="rateExercise('${ex.id}',2)">

⭐2

</button>

<button
class="btn btn-warning action-btn"
onclick="rateExercise('${ex.id}',3)">

⭐3

</button>

<button
class="btn btn-warning action-btn"
onclick="rateExercise('${ex.id}',4)">

⭐4

</button>

<button
class="btn btn-warning action-btn"
onclick="rateExercise('${ex.id}',5)">

⭐5

</button>

</div>


<!-- Comment Box -->

<textarea
class="form-control comment-box mt-3"
id="comment-${ex.id}"
rows="3"
placeholder="Write comment...">${ex.comment || ""}</textarea>


<button
class="btn btn-info mt-3 action-btn"
onclick="saveComment('${ex.id}')">

<i class="bi bi-chat-left-text"></i>

Save Comment

</button>

</div>

`;

});

if(list.length===0){

html = `
<div class="alert alert-secondary">

No exercises found.

</div>
`;

}

document.getElementById("exerciseList").innerHTML = html;

}

/* SEARCH */
document.getElementById("searchInput")
.addEventListener("keyup",(e)=>{

const keyword = e.target.value.toLowerCase();

const filtered = allExercises.filter(ex=>

ex.studentName.toLowerCase()
.includes(keyword)

);

renderExercises(filtered);

});


/* FILTER LESSON */
document.getElementById("filterLesson")
.addEventListener("change",(e)=>{

const lesson = e.target.value;

if(lesson==="all"){

renderExercises(allExercises);

}else{

const filtered = allExercises.filter(ex=>

String(ex.lesson)===lesson

);

renderExercises(filtered);

}

});

window.likeExercise = async function(id,status){

try{

await updateDoc(
doc(db,"exercises",id),
{
liked:status
}
);

Swal.fire({
icon:"success",
title: status
? "Exercise Liked ❤️"
: "Like Removed",
timer:1000,
showConfirmButton:false
});

loadExercises();

}catch(error){

Swal.fire({
icon:"error",
title:"Error",
text:error.message
});

}

}
/* Rate*/

window.rateExercise = async function(id,rating){

try{

await updateDoc(
doc(db,"exercises",id),
{
rating:rating
}
);

Swal.fire({
icon:"success",
title:`Rated ${rating}/5 ⭐`,
timer:1000,
showConfirmButton:false
});

loadExercises();

}catch(error){

Swal.fire({
icon:"error",
title:"Error",
text:error.message
});

}

}
/* Comment */
window.saveComment = async function(id){

try{

const comment =
document.getElementById(
`comment-${id}`
).value;

await updateDoc(
doc(db,"exercises",id),
{
comment:comment
}
);

Swal.fire({
icon:"success",
title:"Comment Saved",
timer:1000,
showConfirmButton:false
});

loadExercises();

}catch(error){

Swal.fire({
icon:"error",
title:"Error",
text:error.message
});

}

}


/* LOGOUT */
document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

Swal.fire({
icon:"success",
title:"Logged Out",
timer:1000,
showConfirmButton:false
});

setTimeout(()=>{

window.location="login.html";

},1000);

});

</script>

</body>
</html>
