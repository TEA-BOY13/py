<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Signup | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.card-box{
background:rgba(255,255,255,.06);
padding:35px;
border-radius:20px;
width:100%;
max-width:450px;
box-shadow:0 0 25px rgba(0,0,0,.4);
animation:fadeUp .8s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

.form-control{
border-radius:12px;
padding:12px;
}

.btn-custom{
border-radius:30px;
}

.logo{
text-align:center;
font-size:1.3rem;
font-weight:bold;
color:#0dcaf0;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="card-box">

<div class="logo">
<i class="bi bi-shield-lock"></i>
 ADMIN SIGNUP
</div>

<form id="adminForm">

<input type="text" id="name" class="form-control mb-3"
placeholder="Admin Name" required>

<input type="email" id="email" class="form-control mb-3"
placeholder="Email" required>

<input type="password" id="password" class="form-control mb-3"
placeholder="Password" required>

<input type="password" id="secret" class="form-control mb-3"
placeholder="Admin Secret Key" required>

<button class="btn btn-info w-100 btn-custom">
Create Admin Account
</button>

</form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain: "vttonlinelesson.firebaseapp.com",
projectId: "vttonlinelesson",
storageBucket: "vttonlinelesson.firebasestorage.app",
messagingSenderId: "152996856308",
appId: "1:152996856308:web:f0988069482ce7e893f9a1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 SECRET KEY (CHANGE THIS!) */
const ADMIN_SECRET = "VTT-ADMIN-2026";

document.getElementById("adminForm").addEventListener("submit", async(e)=>{

e.preventDefault();

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const secret = document.getElementById("secret").value;

if(secret !== ADMIN_SECRET){

Swal.fire({
icon:"error",
title:"Access Denied",
text:"Invalid Admin Secret Key"
});

return;
}

try{

const userCredential =
await createUserWithEmailAndPassword(auth,email,password);

await setDoc(doc(db,"users",userCredential.user.uid),{

fullname:name,
email:email,
role:"admin",
createdAt:new Date()

});

Swal.fire({
icon:"success",
title:"Admin Created",
text:"You can now login as admin"
}).then(()=>{

window.location="../login.html";

});

}catch(err){

Swal.fire({
icon:"error",
title:"Error",
text:err.message
});

}

});

</script>

</body>
</html>
