<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learners Management | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Segoe UI,sans-serif;
overflow-x:hidden;
}

.header{
background:linear-gradient(135deg,#0dcaf0,#2563eb);
padding:25px;
border-radius:20px;
margin-bottom:30px;
animation:fadeDown .6s;
}

.header h2{
margin:0;
font-weight:bold;
}

.stats-card{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
text-align:center;
transition:.4s;
height:100%;
}

.stats-card:hover{
transform:translateY(-8px);
box-shadow:0 0 20px rgba(13,202,240,.4);
}

.stats-number{
font-size:35px;
font-weight:bold;
color:#0dcaf0;
}

.table-card{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:20px;
margin-top:25px;
animation:fadeUp .8s;
}

.table{
color:white;
}

.table thead{
background:#0dcaf0;
color:black;
}

.table tbody tr:hover{
background:rgba(255,255,255,.06);
}

.form-control{
background:#1e293b;
border:none;
color:white;
}

.form-control:focus{
background:#1e293b;
color:white;
box-shadow:0 0 10px #0dcaf0;
}

.badge-active{
background:#198754;
}

.badge-disabled{
background:#dc3545;
}

.btn-action{
margin:2px;
border-radius:30px;
}

@keyframes fadeDown{

from{
opacity:0;
transform:translateY(-30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>
<body>

<div class="container py-4">

<div class="header">

<h2>
<i class="bi bi-people-fill"></i>
 Learners Management
</h2>

<p class="mb-0">
Manage registered learners of VISIONARYTECH TITAN.
</p>

</div>

<div class="row g-4">

<div class="col-md-4">

<div class="stats-card">

<div class="stats-number" id="totalLearners">0</div>

<h5>Total Learners</h5>

</div>

</div>

<div class="col-md-4">

<div class="stats-card">

<div class="stats-number text-success" id="activeLearners">0</div>

<h5>Active</h5>

</div>

</div>

<div class="col-md-4">

<div class="stats-card">

<div class="stats-number text-danger" id="disabledLearners">0</div>

<h5>Disabled</h5>

</div>

</div>

</div>

<div class="table-card">

<div class="row mb-3">

<div class="col-md-6">

<input
type="text"
id="searchInput"
class="form-control"
placeholder="Search learner by name or email...">

</div>

<div class="col-md-6 text-end">

<button class="btn btn-info">

<i class="bi bi-arrow-clockwise"></i>

Refresh

</button>

</div>

</div>

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>#</th>

<th>Full Name</th>

<th>Email</th>

<th>Phone</th>

<th>Role</th>

<th>Status</th>

<th>Registered</th>

<th width="220">Actions</th>

</tr>

</thead>

<tbody id="learnersTable">

<tr>

<td colspan="8" class="text-center py-5">

<div class="spinner-border text-info"></div>

<p class="mt-3">

Loading learners...

</p>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import Swal from "https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm";

const firebaseConfig = {

apiKey:"AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain:"vttonlinelesson.firebaseapp.com",
projectId:"vttonlinelesson",
storageBucket:"vttonlinelesson.firebasestorage.app",
messagingSenderId:"152996856308",
appId:"1:152996856308:web:f0988069482ce7e893f9a1"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let learners=[];

/* ---------------- ADMIN PROTECTION ---------------- */

onAuthStateChanged(auth,async(user)=>{

if(!user){

location="login.html";
return;

}

const adminSnap=await getDoc(doc(db,"users",user.uid));

if(!adminSnap.exists()){

location="../login.html";
return;

}

if(adminSnap.data().role!=="admin"){

Swal.fire({
icon:"error",
title:"Access Denied"
});

location="../dashboard.html";
return;

}

loadLearners();

});

/* ---------------- LOAD ---------------- */

async function loadLearners(){

learners=[];

let total=0;
let active=0;
let disabled=0;

const snap=await getDocs(collection(db,"users"));

snap.forEach(d=>{

const data=d.data();

if(data.role==="learner"){

total++;

if(data.status==="disabled"){

disabled++;

}else{

active++;

}

learners.push({

id:d.id,

...data

});

}

});

document.getElementById("totalLearners").innerHTML=total;
document.getElementById("activeLearners").innerHTML=active;
document.getElementById("disabledLearners").innerHTML=disabled;

renderTable(learners);

}

/* ---------------- TABLE ---------------- */

function renderTable(list){

let html="";

list.forEach((u,index)=>{

const date=u.createdAt?.toDate?
u.createdAt.toDate().toLocaleDateString():
"-";

const status=u.status==="disabled"
?'<span class="badge bg-danger">Disabled</span>'
:'<span class="badge bg-success">Active</span>';

html+=`

<tr>

<td>${index+1}</td>

<td>${u.fullname||""}</td>

<td>${u.email||""}</td>

<td>${u.phone||"-"}</td>

<td>${u.role}</td>

<td>${status}</td>

<td>${date}</td>

<td>

<button
class="btn btn-warning btn-sm btn-action"
onclick="toggleStatus('${u.id}','${u.status||"active"}')">

<i class="bi bi-slash-circle"></i>

${u.status==="disabled"?"Enable":"Disable"}

</button>

<button
class="btn btn-danger btn-sm btn-action"
onclick="deleteLearner('${u.id}')">

<i class="bi bi-trash"></i>

Delete

</button>

</td>

</tr>

`;

});

if(html===""){

html=`
<tr>
<td colspan="8" class="text-center">
No learners found.
</td>
</tr>
`;

}

document.getElementById("learnersTable").innerHTML=html;

}

/* ---------------- SEARCH ---------------- */

document.getElementById("searchInput").addEventListener("keyup",e=>{

const key=e.target.value.toLowerCase();

const filtered=learners.filter(x=>

(x.fullname||"").toLowerCase().includes(key) ||

(x.email||"").toLowerCase().includes(key)

);

renderTable(filtered);

});

/* ---------------- DISABLE ---------------- */

window.toggleStatus=async(id,status)=>{

const newStatus=status==="disabled"
?"active"
:"disabled";

await updateDoc(doc(db,"users",id),{

status:newStatus

});

Swal.fire({

icon:"success",

title:"Updated"

});

loadLearners();

};

/* ---------------- DELETE ---------------- */

window.deleteLearner=async(id)=>{

const ok=await Swal.fire({

title:"Delete learner?",

text:"Firestore record will be deleted.",

icon:"warning",

showCancelButton:true

});

if(!ok.isConfirmed) return;

await deleteDoc(doc(db,"users",id));

Swal.fire({

icon:"success",

title:"Deleted"

});

loadLearners();

};

/* ---------------- LOGOUT ---------------- */

window.logout=async()=>{

await signOut(auth);

location="login.html";

};

</script>

</body>
</html>
