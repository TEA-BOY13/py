/* Sidebar */

.logo{

}

.sidebar a{
display:block;

}

/* Main */

/* Stats Cards */

.stats-card{

padding:25px;
border-radius:25px;
text-align:center;
transition:.4s;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.stats-card:hover{
transform:translateY(-8px);

}

.stats-number{

.total{

.active{

.restricted{

}

/* Search Box */

.search-box{

padding:20px;
border-radius:20px;
margin-top:30px;
margin-bottom:30px;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.form-control{
background:#1e293b;
border:none;
color:white;
}

.form-control:focus{
background:#1e293b;
color:white;
box-shadow:none;
border:1px solid #0dcaf0;
}

/* Student Card */

.student-card{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:25px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,.25);
animation:fadeUp .6s ease;
transition:.4s;
}

.student-card:hover{
transform:translateY(-8px);
}

.avatar{
width:75px;
height:75px;
border-radius:50%;
background:#0dcaf0;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
color:black;
}

.student-name{
color:#0dcaf0;
font-weight:bold;
}

.badge{
font-size:.9rem;
padding:8px 15px;
}

.btn{
border-radius:30px;
padding:10px 20px;
}

/* Animation */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* Mobile */

.menu-btn{
display:none;
}

@media(max-width:768px){

.sidebar{
left:-270px;
transition:.4s;
}

.sidebar.show{

.main{
margin-left:0;
padding:20px;

.menu-btn{

<script type="module">
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
updateDoc,
onSnapshot,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import Swal
from "https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm";


const firebaseConfig = {

apiKey:"AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain:"vttonlinelesson.firebaseapp.com",
projectId:"vttonlinelesson",
storageBucket:"vttonlinelesson.firebasestorage.app",
messagingSenderId:"152996856308",
appId:"1:152996856308:web:f0988069482ce7e893f9a1"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

let allStudents=[];


/* ADMIN PROTECTION */

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location="login.html";
return;

}

const adminSnap =
await getDoc(doc(db,"users",user.uid));

if(!adminSnap.exists()){

window.location="login.html";
return;

}

if(adminSnap.data().role!=="admin"){

Swal.fire({
icon:"error",
title:"Access Denied"
});

window.location="../dashboard.html";

return;

}

listenStudents();

});


/* REAL TIME STUDENTS */

function listenStudents(){

onSnapshot(collection(db,"users"),

async(snapshot)=>{

allStudents=[];

let total=0;
let active=0;
let restricted=0;

for(const studentDoc of snapshot.docs){

const student=studentDoc.data();

if(student.role==="student"){

total++;

if(student.status==="restricted"){

restricted++;

}else{

active++;

}


/* Count exercises */

let exerciseCount=0;

const exerciseSnap =
await getDocs(collection(db,"exercises"));

exerciseSnap.forEach(ex=>{

if(ex.data().userId===studentDoc.id){

exerciseCount++;

}

});


allStudents.push({

id:studentDoc.id,
exerciseCount,
...student

});

}

}


document.getElementById("totalStudents").innerText=total;
document.getElementById("activeStudents").innerText=active;
document.getElementById("restrictedStudents").innerText=restricted;

renderStudents(allStudents);

});

}

function renderStudents(list){

let html="";

list.forEach(student=>{

const initials = student.fullname
? student.fullname
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase()
:"?";

const status=student.status || "active";

html+=`

<div class="student-card">

<div class="row">

<div class="col-md-8">

<div class="d-flex">

<div class="avatar">

${initials}

</div>

<div class="ms-3">

<h4 class="student-name">

${student.fullname}

</h4>

<p class="text-secondary">

${student.email}

</p>

<p>

📞 ${student.phone || "No phone"}

</p>

<p>

📚 Exercises Submitted:
<b>${student.exerciseCount}</b>

</p>

</div>

</div>

</div>

<div class="col-md-4 text-md-end">

${status==="active"

?

`<span class="badge bg-success">
🟢 Active
</span>`

:

`<span class="badge bg-danger">
🔒 Restricted
</span>`

}

<br><br>

${

status==="active"

?

`
<button
class="btn btn-danger"
onclick="restrictStudent('${student.id}')">

Restrict

</button>
`

:

`
<button
class="btn btn-success"
onclick="activateStudent('${student.id}')">

Activate

</button>
`

}

</div>

</div>

</div>

`;

});

document.getElementById("studentList").innerHTML=html;

}

</script>
