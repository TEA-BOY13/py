<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Admin Dashboard | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
background:#0f172a;
color:white;
}

/* Sidebar */
.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100%;
background:#1e293b;
padding:20px;
transition:.3s;
overflow-y:auto;
}

.sidebar.hide{
left:-260px;
}

/* Main */
.main{
margin-left:280px;
padding:30px;
transition:.3s;
}

.main.full{
margin-left:20px;
}

/* Toggle */
.toggle-btn{
position:fixed;
top:15px;
left:15px;
z-index:999;
background:#0dcaf0;
border:none;
padding:10px 12px;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

/* Cards */
.card-box{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:20px;
margin-bottom:20px;
animation:fadeUp .6s ease;
}

.stats-card{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
text-align:center;
transition:.3s;
}

.stats-card:hover{
transform:translateY(-8px);
box-shadow:0 0 20px rgba(13,202,240,.3);
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* Mobile */
@media(max-width:768px){
.sidebar{
left:-260px;
}
.main{
margin-left:20px;
}
}

</style>
</head>

<body>

<!-- TOGGLE -->
<button class="toggle-btn" onclick="toggleSidebar()">
<i class="bi bi-list"></i>
</button>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<h4 class="text-info mb-4">
<i class="bi bi-shield-lock"></i>
Admin Panel
</h4>

<a class="text-white d-block mb-3" href="dashboard.html">
<i class="bi bi-speedometer2"></i> Dashboard
</a>

<a class="text-white d-block mb-3" href="exercises.html">
<i class="bi bi-journal-text"></i> Exercises
</a>

<a class="text-white d-block mb-3" href="#">
<i class="bi bi-people"></i> Students
</a>

<a class="text-danger d-block mt-5" href="#" id="logoutBtn">
<i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>

<!-- MAIN -->
<div class="main" id="main">

<h2 class="mb-4">
Secure Admin Dashboard 🔐
</h2>

<!-- STATS -->
<div class="row g-4">

<div class="col-md-3">
<div class="stats-card">
<h2 id="studentsCount">0</h2>
<p>Students</p>
</div>
</div>

<div class="col-md-3">
<div class="stats-card">
<h2 id="exercisesCount">0</h2>
<p>Exercises</p>
</div>
</div>

<div class="col-md-3">
<div class="stats-card">
<h2 id="reviewedCount">0</h2>
<p>Reviewed</p>
</div>
</div>

<div class="col-md-3">
<div class="stats-card">
<h2 id="pendingCount">0</h2>
<p>Pending</p>
</div>
</div>

</div>

<!-- RECENT -->
<div class="card-box mt-4">

<h4>Recent Submissions</h4>
<div id="recentBox">Loading...</div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import Swal from "https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm";

/* Firebase Config */
const firebaseConfig = {
apiKey: "AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain: "vttonlinelesson.firebaseapp.com",
projectId: "vttonlinelesson",
storageBucket: "vttonlinelesson.firebasestorage.app",
messagingSenderId: "152996856308",
appId: "1:152996856308:web:f0988069482ce7e893f9a1"
};

/* Prevent duplicate init */
const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];

const auth = getAuth(app);
const db = getFirestore(app);

/* SIDEBAR TOGGLE */
window.toggleSidebar = function(){
document.getElementById("sidebar").classList.toggle("hide");
document.getElementById("main").classList.toggle("full");
}

/* 🔐 ADMIN PROTECTION */
onAuthStateChanged(auth, async(user)=>{

if(!user){
window.location="../login.html";
return;
}

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
window.location="../login.html";
return;
}

const data = snap.data();

/* ❌ NOT ADMIN */
if(data.role !== "admin"){
Swal.fire({
icon:"error",
title:"Access Denied",
text:"Admins only!"
});

setTimeout(()=>{
window.location="../dashboard.html";
},1200);

return;
}

/* ✅ ADMIN OK */
loadDashboard();

});

/* LOAD DATA */
async function loadDashboard(){

const usersSnap = await getDocs(collection(db,"users"));
const exSnap = await getDocs(collection(db,"exercises"));

let students = 0;
let exercises = 0;
let reviewed = 0;
let pending = 0;

let recentHTML = "";

usersSnap.forEach(()=>students++);

exSnap.forEach(doc=>{

exercises++;

const d = doc.data();

if(d.rating > 0) reviewed++;
else pending++;

recentHTML += `
<div class="card bg-dark text-white p-3 mb-2">

<h6>Lesson ${d.lesson}</h6>
<p>${d.answer}</p>
<p>⭐ ${d.rating || 0}/5</p>

</div>
`;

});

document.getElementById("studentsCount").innerText = students;
document.getElementById("exercisesCount").innerText = exercises;
document.getElementById("reviewedCount").innerText = reviewed;
document.getElementById("pendingCount").innerText = pending;

document.getElementById("recentBox").innerHTML =
recentHTML || "<p>No data yet</p>";

}

/* LOGOUT */
document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

Swal.fire({
icon:"success",
title:"Logged Out",
timer:1000,
showConfirmButton:false
});

setTimeout(()=>{

window.location="login.html";

},1000);

});

</script>

</body>
</html>
