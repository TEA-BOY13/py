<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VISIONARYTECH TITAN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.login-card{
width:100%;
max-width:430px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.3);
animation:fadeUp .8s ease;
color:white;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
font-size:1.5rem;
font-weight:bold;
color:#0dcaf0;
}

.form-control{
border-radius:15px;
padding:13px;
}

.btn-custom{
border-radius:30px;
padding:12px;
font-weight:bold;
}

.toggle{
cursor:pointer;
}

.spinner-border{
display:none;
}

</style>
</head>
<body>

<div class="login-card">

<div class="text-center mb-4">

<div class="logo">
<i class="bi bi-code-slash"></i>
VISIONARYTECH TITAN
</div>

<h3 class="mt-3">
Python Learning Hub
</h3>

<p class="text-secondary">
Login to continue
</p>

</div>

<form id="loginForm">

<div class="mb-3">
<input
type="email"
id="email"
class="form-control"
placeholder="Email Address"
required>
</div>

<div class="mb-3 position-relative">

<input
type="password"
id="password"
class="form-control"
placeholder="Password"
required>

<span
class="position-absolute top-50 end-0 translate-middle-y me-3 toggle"
onclick="togglePassword()">

<i class="bi bi-eye" id="eyeIcon"></i>

</span>

</div>

<button class="btn btn-info w-100 btn-custom">

<span
class="spinner-border spinner-border-sm"
id="loader">
</span>

Login

</button>

</form>

<div class="text-center mt-4">
Don't have an account?
<a href="signup.html" class="text-info">
Create Account
</a>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAhso-48HzA8H_-PLhtDqm0Ua1plFbQ3TQ",
authDomain: "vttonlinelesson.firebaseapp.com",
databaseURL: "https://vttonlinelesson-default-rtdb.firebaseio.com",
projectId: "vttonlinelesson",
storageBucket: "vttonlinelesson.firebasestorage.app",
messagingSenderId: "152996856308",
appId: "1:152996856308:web:f0988069482ce7e893f9a1",
measurementId: "G-CC59VEFF32"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// Auto Login

onAuthStateChanged(auth, async(user)=>{

if(user){

const docRef = doc(db,"users",user.uid);

const docSnap = await getDoc(docRef);

if(docSnap.exists()){

const role = docSnap.data().role;

if(role==="admin"){
window.location="admin/dashboard.html";
}
else{
window.location="dashboard.html";
}

}

}

});



document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

loader.style.display="inline-block";

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const uid=userCredential.user.uid;

const docRef=doc(db,"users",uid);

const docSnap=await getDoc(docRef);

loader.style.display="none";

if(docSnap.exists()){

const role=docSnap.data().role;

Swal.fire({
icon:"success",
title:"Login Successful",
timer:1500,
showConfirmButton:false
});

setTimeout(()=>{

if(role==="admin"){
window.location="admin/dashboard.html";
}else{
window.location="dashboard.html";
}

},1500);

}

}catch(error){

loader.style.display="none";

Swal.fire({
icon:"error",
title:"Login Failed",
text:error.message
});

}

});



window.togglePassword=function(){

const password=document.getElementById("password");

const eye=document.getElementById("eyeIcon");

if(password.type==="password"){
password.type="text";
eye.className="bi bi-eye-slash";
}
else{
password.type="password";
eye.className="bi bi-eye";
}

}

</script>

</body>
</html>
